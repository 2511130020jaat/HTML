<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulario de contacto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        min-height: 100vh;
        background:
          radial-gradient(
            ellipse at top left,
            rgba(13, 110, 253, 0.1),
            transparent 42%
          ),
          #f4f7fb;
      }

      .contact-card {
        max-width: 560px;
        border: 1px solid rgba(13, 42, 82, 0.08);
        border-radius: 1.25rem;
        box-shadow: 0 1rem 3rem rgba(23, 43, 77, 0.1);
      }

      .contact-mark {
        display: grid;
        width: 3rem;
        height: 3rem;
        place-items: center;
        border-radius: 1rem;
        background: #e7f0ff;
        color: #0d6efd;
        font-size: 1.25rem;
        font-weight: 700;
      }

      .form-control {
        padding: 0.75rem 0.9rem;
        border-color: #dce3ed;
      }

      .form-control:focus {
        border-color: #86b7fe;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
      // Inicializar EmailJS con tu Public Key
      (function () {
        emailjs.init("n4FLEbvSISY6wv72b");
      })();
      function enviarCorreo(e) {
        e.preventDefault(); // evitar recarga del form
        emailjs
          .send("service_jbrk5yw", "template_go67nzh", {
            name: document.getElementById("nombre").value,
            email: document.getElementById("email").value,
            message: document.getElementById("mensaje").value,
          })
          .then((res) => {
            alert("Correo enviado correctamente!");
            console.log("Respuesta:", res);
          })
          .catch((err) => {
            alert("Error al enviar el correo.");
            console.error("Error:", err);
          });
      }
    </script>
  </head>
  <body class="d-flex align-items-center py-5">
    <main class="container">
      <div class="contact-card card mx-auto p-4 p-sm-5 bg-white">
        <header class="mb-4">
          <div class="contact-mark mb-3" aria-hidden="true">@</div>
          <p class="text-primary fw-semibold text-uppercase small mb-2">
            FORMULARIO
          </p>
          <h1 class="h2 fw-bold text-dark mb-2">Rellenar</h1>
          <p class="text-secondary mb-0">Completa el formulario.</p>
        </header>

        <form onsubmit="enviarCorreo(event)">
          <div class="mb-3">
            <label for="nombre" class="form-label fw-semibold">Nombre</label>
            <input
              type="text"
              class="form-control"
              id="nombre"
              name="nombre"
              placeholder="Tu nombre"
              autocomplete="name"
              required
            />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold"
              >Correo electrónico</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="nombre@ejemplo.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="mb-4">
            <label for="mensaje" class="form-label fw-semibold">Mensaje</label>
            <textarea
              class="form-control"
              id="mensaje"
              name="mensaje"
              rows="5"
              placeholder="Escribe aquí tu mensaje..."
              required
            ></textarea>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg w-100 fw-semibold"
          >
            Enviar mensaje
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
